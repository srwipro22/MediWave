<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Appointments - MediWave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-heartbeat me-2"></i>MediWave
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/}">New Appointment</a>
                <a class="nav-link active" th:href="@{/appointments}">All Appointments</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">
                            <i class="fas fa-list me-2"></i>All Appointments
                        </h4>
                        <button class="btn btn-light btn-sm" onclick="location.reload()">
                            <i class="fas fa-sync-alt me-1"></i>Refresh
                        </button>
                    </div>
                    <div class="card-body">
                        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Patient ID</th>
                                        <th>Doctor ID</th>
                                        <th>Date & Time</th>
                                        <th>Type</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${appointments == null or #lists.isEmpty(appointments)}">
                                        <td colspan="7" class="text-center text-muted">
                                            <i class="fas fa-calendar-times fa-3x mb-3"></i>
                                            <p>No appointments found. Book your first appointment!</p>
                                        </td>
                                    </tr>
                                    <tr th:each="appointment : ${appointments}">
                                        <td th:text="${appointment.id}">1</td>
                                        <td th:text="${appointment.patientId}">123</td>
                                        <td th:text="${appointment.doctorId}">456</td>
                                        <td th:text="${#temporals.format(appointment.appointmentDate, 'yyyy-MM-dd HH:mm')}">2024-01-15 10:30</td>
                                        <td th:text="${appointment.appointmentType}">General</td>
                                        <td>
                                            <span th:class="${'badge ' + #strings.toLowerCase(appointment.status) == 'scheduled' ? 'bg-warning' : 
                                                                   #strings.toLowerCase(appointment.status) == 'confirmed' ? 'bg-success' : 
                                                                   #strings.toLowerCase(appointment.status) == 'cancelled' ? 'bg-danger' : 
                                                                   #strings.toLowerCase(appointment.status) == 'billing_failed' ? 'bg-danger' : 
                                                                   #strings.toLowerCase(appointment.status) == 'resource_unavailable' ? 'bg-warning' : 'bg-secondary'}"
                                                  th:text="${appointment.status}">SCHEDULED</span>
                                        </td>
                                        <td>
                                            <div class="btn-group btn-group-sm" role="group">
                                                <a th:href="@{/appointments/{id}(id=${appointment.id})}" class="btn btn-outline-primary">
                                                    <i class="fas fa-eye"></i>
                                                </a>
                                                <div class="btn-group btn-group-sm" role="group">
                                                    <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                                                        <i class="fas fa-edit"></i>
                                                    </button>
                                                    <ul class="dropdown-menu">
                                                        <li><a class="dropdown-item" th:href="@{/appointments/{id}/status(id=${appointment.id}, status='CONFIRMED')}">Confirm</a></li>
                                                        <li><a class="dropdown-item" th:href="@{/appointments/{id}/status(id=${appointment.id}, status='CANCELLED')}">Cancel</a></li>
                                                        <li><a class="dropdown-item" th:href="@{/appointments/{id}/status(id=${appointment.id}, status='COMPLETED')}">Complete</a></li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
