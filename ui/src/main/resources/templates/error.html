<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - MediWave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-heartbeat me-2"></i>MediWave
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/}">New Appointment</a>
                <a class="nav-link" th:href="@{/appointments}">All Appointments</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-exclamation-triangle me-2"></i>Error
                        </h4>
                    </div>
                    <div class="card-body text-center">
                        <i class="fas fa-exclamation-circle fa-4x text-danger mb-4"></i>
                        <div th:if="${error}" class="alert alert-danger">
                            <span th:text="${error}"></span>
                        </div>
                        <p class="text-muted">An error occurred while processing your request.</p>
                        <div class="d-flex justify-content-center gap-2">
                            <a th:href="@{/}" class="btn btn-primary">
                                <i class="fas fa-home me-2"></i>Home
                            </a>
                            <a th:href="@{/appointments}" class="btn btn-secondary">
                                <i class="fas fa-list me-2"></i>Appointments
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
