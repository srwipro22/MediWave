<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediWave - Healthcare Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-heartbeat me-2"></i>MediWave
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/}">New Appointment</a>
                <a class="nav-link" th:href="@{/appointments}">All Appointments</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-calendar-plus me-2"></i>Book New Appointment
                        </h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="@{/appointments}" th:object="${appointmentRequest}" method="post">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="patientId" class="form-label">Patient ID</label>
                                    <input type="number" class="form-control" th:field="*{patientId}" id="patientId" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('patientId')}" th:errors="*{patientId}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="doctorId" class="form-label">Doctor ID</label>
                                    <input type="number" class="form-control" th:field="*{doctorId}" id="doctorId" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}"></div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="appointmentDate" class="form-label">Appointment Date & Time</label>
                                    <input type="datetime-local" class="form-control" th:field="*{appointmentDate}" id="appointmentDate" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('appointmentDate')}" th:errors="*{appointmentDate}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="appointmentType" class="form-label">Appointment Type</label>
                                    <select class="form-select" th:field="*{appointmentType}" id="appointmentType" required>
                                        <option value="">Select Type</option>
                                        <option value="general">General Consultation</option>
                                        <option value="specialist">Specialist Consultation</option>
                                        <option value="emergency">Emergency</option>
                                        <option value="consultation">Consultation</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('appointmentType')}" th:errors="*{appointmentType}"></div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="notes" class="form-label">Notes</label>
                                <textarea class="form-control" th:field="*{notes}" id="notes" rows="3" placeholder="Additional notes..."></textarea>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="fas fa-calendar-check me-2"></i>Book Appointment
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card mt-4">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-info-circle me-2"></i>System Workflow
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3 text-center">
                                <div class="workflow-step">
                                    <i class="fas fa-user-md fa-3x text-primary mb-2"></i>
                                    <h6>Appointment Booking</h6>
                                    <small class="text-muted">Patient books appointment</small>
                                </div>
                            </div>
                            <div class="col-md-3 text-center">
                                <div class="workflow-step">
                                    <i class="fas fa-arrow-right fa-2x text-muted mb-3"></i>
                                </div>
                            </div>
                            <div class="col-md-3 text-center">
                                <div class="workflow-step">
                                    <i class="fas fa-credit-card fa-3x text-warning mb-2"></i>
                                    <h6>Billing Processing</h6>
                                    <small class="text-muted">Insurance verification</small>
                                </div>
                            </div>
                            <div class="col-md-3 text-center">
                                <div class="workflow-step">
                                    <i class="fas fa-arrow-right fa-2x text-muted mb-3"></i>
                                </div>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-3 text-center">
                                <div class="workflow-step">
                                    <i class="fas fa-hospital fa-3x text-success mb-2"></i>
                                    <h6>Resource Allocation</h6>
                                    <small class="text-muted">Doctor, room, equipment</small>
                                </div>
                            </div>
                            <div class="col-md-3 text-center">
                                <div class="workflow-step">
                                    <i class="fas fa-arrow-right fa-2x text-muted mb-3"></i>
                                </div>
                            </div>
                            <div class="col-md-3 text-center">
                                <div class="workflow-step">
                                    <i class="fas fa-check-circle fa-3x text-info mb-2"></i>
                                    <h6>Status Update</h6>
                                    <small class="text-muted">Final confirmation</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
